<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สแกนเก็บคะแนน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--ink:#1d2b3a;--pri:#1f5f5b;--chalk:#f2c14e;--bad:#b3392f;--line:#d9ded8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Sarabun,sans-serif;color:var(--ink);background:#f3f5f2}
header{background:var(--pri);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff}
main{max-width:560px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
input,select,button{font:inherit;padding:9px 10px;border:1px solid #b9c2bb;border-radius:6px;background:#fff;max-width:100%}
button{background:var(--pri);color:#fff;border:0}button.alt{background:#e6ebe6;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
#bar{background:#fff7dc;border-left:5px solid var(--chalk);padding:8px 10px;border-radius:6px;margin:8px 0}
#reader{width:100%}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;display:none}
#toast.err{background:var(--bad)}
.small{font-size:14px;color:#5b6b66}
</style></head><body>
<header><b>สแกนเก็บคะแนน</b><span id="who"></span></header>
<main>
<div class="card" id="setup" hidden>
  <b>ตั้งค่าครั้งแรก</b>
  <div class="row"><input id="url" placeholder="วางลิงก์เว็บแอป Apps Script (ลงท้าย /exec)" style="width:100%"></div>
  <div class="row"><input id="lu" placeholder="ชื่อผู้ใช้"><input id="lp" type="password" placeholder="รหัสผ่าน" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">เข้าสู่ระบบ</button></div>
</div>

<div id="app" hidden>
  <div class="card">
    <div class="row"><select id="cls" onchange="loadCls()"></select><select id="unit" onchange="bar()" style="flex:1"></select></div>
    <div id="bar"></div><div id="miss" class="small" hidden></div>
    <div id="reader"></div>
    <div class="row"><button id="cam" onclick="toggleCam()">เปิดกล้อง</button>
      <label class="small"><input type="checkbox" id="auto"> ส่งแล้ว = ให้เต็มอัตโนมัติ</label></div>
    <div class="row"><input id="manual" placeholder="หรือพิมพ์/ยิงเลขประจำตัว แล้ว Enter" style="flex:1"
      onkeydown="if(event.key==='Enter'){pick(this.value.trim());this.value=''}"></div>
  </div>
  <div class="card" id="res" hidden>
    <h3 id="nm" style="margin:0"></h3><div id="info" style="font-weight:700"></div><div id="chk" class="small"></div>
    <div class="row"><input id="sc" type="number" step="any" placeholder="คะแนน" style="width:110px" onkeydown="if(event.key==='Enter')saveCur()">
      <button onclick="saveCur()">บันทึก</button><button class="alt" id="full" onclick="fullScore()"></button>
      <button class="alt" onclick="$('#res').hidden=true">ยกเลิก</button></div>
  </div>
  <div class="card"><b>บันทึกล่าสุด</b><div id="log" class="small"></div></div>
  <button class="alt" onclick="logout()">ออกจากระบบ</button>
</div>
</main><div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const S = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };
function toast(m, err) { const t = $('#toast'); t.textContent = m; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2600); }

async function api(fn, ...args) {
  const r = await fetch(L('api'), {method: 'POST', body: JSON.stringify({fn, token: L('tk'), args})});  // text/plain → ไม่ติด CORS preflight
  const j = await r.json();
  if (j.error) { if (/หมดเวลา/.test(j.error)) logout(true); toast(j.error, 1); throw new Error(j.error); }
  return j.data;
}
function show(loggedIn) { $('#setup').hidden = loggedIn; $('#app').hidden = !loggedIn; }
function logout(silent) { S('tk', ''); $('#who').textContent = ''; if (scanner) toggleCam(); show(false); if (!silent) toast('ออกจากระบบแล้ว'); }
async function doLogin() {
  const u = $('#url').value.trim() || L('api');
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(u)) return toast('ลิงก์ไม่ถูกต้อง ต้องลงท้ายด้วย /exec', 1);
  S('api', u);
  try { const r = await api('login', $('#lu').value, $('#lp').value); S('tk', r.token); start(r.me); } catch (e) {}
}
function start(me) { $('#who').textContent = me.name; show(true);
  api('getClasses').then(cs => { $('#cls').innerHTML = cs.map(c => `<option>${esc(c)}</option>`).join(''); loadCls(); }); }
addEventListener('load', () => {
  $('#url').value = L('api'); show(false); $('#setup').hidden = false;
  if (L('api') && L('tk')) api('getMe').then(start).catch(() => { $('#setup').hidden = false; });
});

/* ---------- สแกนเก็บคะแนน ---------- */
let DATA = {students: [], units: [], map: {}}, ST = {}, cur = null, scanner = null, lastScan = 0, lastText = '';
const has = (sid, uid) => DATA.map[sid + '|' + uid] !== undefined && DATA.map[sid + '|' + uid] !== '';
const curUnit = () => DATA.units.find(x => x.id === $('#unit').value);
const uname = x => (x.subject ? x.subject + ' · ' : '') + x.name;
function loadCls() {
  api('getScores', $('#cls').value).then(d => {
    DATA = d; ST = {}; d.students.forEach(s => ST[s.id] = s);
    $('#unit').innerHTML = d.units.map(x => `<option value="${esc(x.id)}">${esc(uname(x))}</option>`).join('');
    $('#res').hidden = true; bar();
    if (!d.units.length) toast('ห้องนี้ยังไม่มีหน่วยการเรียนรู้ (สร้างในระบบหลักก่อน)', 1);
  });
}
function bar() {
  const un = curUnit(); if (!un) { $('#bar').textContent = 'ยังไม่ได้เลือกงาน'; $('#miss').hidden = true; return; }
  const no = DATA.students.filter(s => !has(s.id, un.id));
  $('#bar').innerHTML = `วิชา <b>${esc(un.subject || '-')}</b> · งาน <b>${esc(un.name)}</b> · เต็ม ${un.maxScore || '-'}<br>` +
    `ส่งแล้ว <b>${DATA.students.length - no.length}/${DATA.students.length}</b> <a href="#" onclick="$('#miss').hidden=!$('#miss').hidden;return false">ดูคนที่ยังไม่ส่ง</a>`;
  $('#miss').innerHTML = no.length ? '<b>ยังไม่ส่ง:</b> ' + no.map(s => esc(s.no + '.' + s.firstName)).join(', ') : 'ส่งครบทุกคนแล้ว 🎉';
}
function pick(text) {
  const [id, uid] = String(text).split('|');
  if (uid && DATA.units.some(x => x.id === uid)) { $('#unit').value = uid; bar(); }
  const s = ST[id]; if (!s) return toast('ไม่พบรหัสนี้ในห้องที่เลือก (ลองเปลี่ยนห้อง)', 1);
  const un = curUnit(); if (!un) return toast('กรุณาเลือกงาน', 1);
  if (navigator.vibrate) navigator.vibrate(80);
  cur = s;
  if ($('#auto').checked && un.maxScore && !has(id, un.id)) { $('#sc').value = un.maxScore; return saveCur(); }
  const old = DATA.map[id + '|' + un.id];
  $('#res').hidden = false; $('#nm').textContent = `เลขที่ ${s.no} ${s.firstName} ${s.lastName}`;
  $('#info').textContent = `${un.subject || '-'} · ${un.name} (เต็ม ${un.maxScore || '-'})` + (has(id, un.id) ? ` · เคยบันทึกแล้ว ${old}` : '');
  $('#chk').innerHTML = DATA.units.map(x => has(id, x.id) ? `✅ ${esc(x.name)}` : `⬜ <b>${esc(x.name)}</b>`).join(' &nbsp; ');
  $('#sc').value = has(id, un.id) ? old : ''; $('#sc').focus();
  $('#full').textContent = 'ให้เต็ม ' + (un.maxScore || ''); $('#full').hidden = !un.maxScore;
}
function fullScore() { $('#sc').value = curUnit().maxScore; saveCur(); }
function saveCur() {
  const un = curUnit(); if (!cur || !un) return;
  const s = cur, v = $('#sc').value;
  api('saveScore', s.id, un.id, v).then(r => {
    if (r === '') delete DATA.map[s.id + '|' + un.id]; else DATA.map[s.id + '|' + un.id] = r;
    $('#res').hidden = true; cur = null; bar(); toast(`บันทึกแล้ว: ${s.firstName} = ${r}`);
    $('#log').insertAdjacentHTML('afterbegin', `<div>${esc(s.no)}. ${esc(s.firstName)} ${esc(s.lastName)} – ${esc(un.name)}: <b>${esc(r)}</b></div>`);
  });
}
function toggleCam() {
  if (scanner) { scanner.stop().then(() => { scanner = null; $('#cam').textContent = 'เปิดกล้อง'; }); return; }
  scanner = new Html5Qrcode('reader');
  scanner.start({facingMode: 'environment'}, {fps: 10, qrbox: 240}, text => {
    if (text === lastText && Date.now() - lastScan < 2500) return;   // กันสแกนซ้ำเล่มเดิม
    lastText = text; lastScan = Date.now(); pick(text);
  }).then(() => $('#cam').textContent = 'ปิดกล้อง')
    .catch(e => { scanner = null; toast('เปิดกล้องไม่ได้ — ตรวจสิทธิ์กล้อง และเปิดด้วย Chrome/Safari', 1); });
}
</script></body></html>
